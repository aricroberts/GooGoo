<!--
  ══════════════════════════════════════════════════════════════════
  SUPABASE SETUP — run once in your project's SQL editor, then paste
  your project URL + anon key into the <script> block just below.

  create table plans_cust (
    user_id uuid primary key references auth.users(id) on delete cascade,
    goal text not null,
    days_per_week int not null,
    sex text,
    cardio_types jsonb not null default '[]'::jsonb,
    volume_modifier numeric not null default 1.0,
    day_overrides jsonb not null default '{}'::jsonb,
    created_at timestamptz not null default now()
  );
  alter table plans_cust enable row level security;
  create policy "own plan" on plans_cust for all
    using (auth.uid() = user_id) with check (auth.uid() = user_id);

  create table workout_progress_cust (
    user_id uuid primary key references auth.users(id) on delete cascade,
    completed_days jsonb not null default '[]'::jsonb,
    updated_at timestamptz not null default now()
  );
  alter table workout_progress_cust enable row level security;
  create policy "own progress" on workout_progress_cust for all
    using (auth.uid() = user_id) with check (auth.uid() = user_id);

  create table checkins_cust (
    id bigserial primary key,
    user_id uuid not null references auth.users(id) on delete cascade,
    week_number int not null,
    sessions_completed int not null,
    days_per_week int,
    effort int not null,
    hr_delta int not null,
    waist numeric,
    weight numeric,
    notes text,
    verdict text not null,
    created_at timestamptz not null default now()
  );
  alter table checkins_cust enable row level security;
  create policy "own checkins" on checkins_cust for all
    using (auth.uid() = user_id) with check (auth.uid() = user_id);

  -- RLS policies alone are not enough — Postgres also requires a base
  -- table grant before RLS is even evaluated. Tables created via the SQL
  -- Editor (rather than the Table Editor UI) don't get this automatically.
  grant select, insert, update on public.plans_cust to authenticated;
  grant select, insert, update on public.workout_progress_cust to authenticated;
  grant select, insert on public.checkins_cust to authenticated;
  grant usage, select on sequence public.checkins_cust_id_seq to authenticated;

  In Authentication settings: enable Email provider. Turn off "Confirm
  email" while testing so signup logs straight in.
  ══════════════════════════════════════════════════════════════════
-->

<script>
/* ═══════════════════════════ SUPABASE HELPERS ═══════════════════════════ */
var SB_URL = window.SUPABASE_URL;
var SB_KEY = window.SUPABASE_ANON_KEY;
var CONFIGURED = SB_URL && SB_URL !== "YOUR_SUPABASE_URL" && SB_KEY && SB_KEY !== "YOUR_SUPABASE_ANON_KEY";

/* ═══════════════════════════ $2 PAYWALL (no subscription) ═══════════════════════════
   First 100-day plan is free. Check-ins are always free — they're the
   adaptive loop, not billable events. Only generating a NEW 100-day plan
   after the first one (built from your completion/progress on it) costs $2.
   Client-trust unlock (matches the sessionStorage pattern used across
   the rest of the ACL suite) — no webhook/backend verification here. */
var STRIPE_PAY_LINK = window.STRIPE_PAY_LINK;
var STRIPE_CONFIGURED = STRIPE_PAY_LINK && STRIPE_PAY_LINK !== "YOUR_STRIPE_PAYMENT_LINK";

function isActionUnlocked(){ return DEMO || sessionStorage.getItem('pf_action_unlocked') === '1'; }
function consumeUnlock(){ sessionStorage.removeItem('pf_action_unlocked'); }
function redirectToPay(pendingAction){
  if(!STRIPE_CONFIGURED){ alert('Payments aren\'t configured yet — paste your Stripe Payment Link into window.STRIPE_PAY_LINK near the top of this file.'); return; }
  sessionStorage.setItem('pf_pending_action', JSON.stringify(pendingAction));
  window.location.href = STRIPE_PAY_LINK;
}
function checkPaymentReturn(){
  var params = new URLSearchParams(window.location.search);
  if(params.get('pf_unlock') === '1'){
    sessionStorage.setItem('pf_action_unlocked', '1');
    history.replaceState({}, '', window.location.pathname);
  }
}
async function resumePendingActionIfAny(){
  var pending = sessionStorage.getItem('pf_pending_action');
  if(!pending || !isActionUnlocked()) return;
  var action = JSON.parse(pending);
  sessionStorage.removeItem('pf_pending_action');
  if(action.type === 'newplan'){
    await handleCreatePlan(action.payload.goal, action.payload.freq, action.payload.sex, action.payload.cardioTypes, true);
  }
}
var DEMO = localStorage.getItem('pf_demo_mode') === '1';

function demoStore(key, def){ try{ var v = JSON.parse(localStorage.getItem(key)); return v==null?def:v; }catch(e){ return def; } }
function demoSave(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

function assign(target){
  for(var i=1;i<arguments.length;i++){
    var src = arguments[i] || {};
    for(var k in src){ if(Object.prototype.hasOwnProperty.call(src,k)) target[k]=src[k]; }
  }
  return target;
}

async function demoDb(path, opts){
  opts = opts || {};
  var method = opts.method || 'GET';
  var body = opts.body ? JSON.parse(opts.body) : null;
  if(path.indexOf('/plans_cust')===0){
    var plans = demoStore('pf_demo_plans', []);
    if(method==='GET') return plans.slice(0,1);
    if(method==='POST'){ var row = assign({}, body, { user_id:'demo-user', created_at:new Date().toISOString() }); plans=[row]; demoSave('pf_demo_plans', plans); return [row]; }
    if(method==='PATCH'){ plans[0] = assign({}, plans[0]||{}, body); demoSave('pf_demo_plans', plans); return plans; }
  }
  if(path.indexOf('/workout_progress_cust')===0){
    var progRows = demoStore('pf_demo_progress', []);
    if(method==='GET') return progRows.slice(0,1);
    if(method==='POST'){ var prow = assign({}, body, { user_id:'demo-user' }); progRows=[prow]; demoSave('pf_demo_progress', progRows); return [prow]; }
    if(method==='PATCH'){ progRows[0] = assign({}, progRows[0]||{}, body); demoSave('pf_demo_progress', progRows); return progRows; }
  }
  if(path.indexOf('/checkins_cust')===0){
    var ciRows = demoStore('pf_demo_checkins', []);
    if(method==='GET'){
      ciRows = ciRows.slice().sort(function(a,b){ return a.week_number-b.week_number; });
      return ciRows;
    }
    if(method==='POST'){

async function db(path, opts){
  opts = opts || {};
  if(DEMO) return demoDb(path, opts);
  var session = getSession();
  var headers = assign({
    'Content-Type':'application/json',
    apikey: SB_KEY,
    Authorization: 'Bearer ' + (session ? session.access_token : SB_KEY),
    Prefer: opts.prefer || 'return=representation'
  }, opts.headers||{});
  var controller = (typeof AbortController!=='undefined') ? new AbortController() : null;
  var timeoutId = controller ? setTimeout(function(){ controller.abort(); }, 15000) : null;
  var res;
  try{
    res = await fetch(SB_URL + '/rest/v1' + path, {
      method: opts.method, body: opts.body, headers: headers,
      signal: controller ? controller.signal : undefined
    });
  } catch(fetchErr){
    if(fetchErr && fetchErr.name === 'AbortError') throw new Error('Request timed out after 15s — check your connection and try again.');
    throw fetchErr;
  } finally {
    if(timeoutId) clearTimeout(timeoutId);
  }
  if(!res.ok){ var t = await res.text(); throw new Error('DB error: ' + t); }
  var text = await res.text();
  return text ? JSON.parse(text) : null;
}

/* ═══════════════════════════ PLAN GENERATOR ═══════════════════════════ */
var PHASES = [
  {id:1, name:'Foundation', range:[1,25], color:'var(--p1)', bg:'var(--p1bg)'},
  {id:2, name:'Build', range:[26,50], color:'var(--p2)', bg:'var(--p2bg)'},
  {id:3, name:'Intensify', range:[51,75], color:'var(--p3)', bg:'var(--p3bg)'},
  {id:4, name:'Finish Strong', range:[76,100], color:'var(--p4)', bg:'var(--p4bg)'}
];
var TYPE_COLORS = {
  Chest:{bg:'#1E3A5F',dot:'#60A5FA'}, Cardio:{bg:'#064E3B',dot:'#34D399'},
  Swim:{bg:'#0C4A6E',dot:'#38BDF8'}, HIIT:{bg:'#7F1D1D',dot:'#F87171'},
  Recovery:{bg:'#1F2937',dot:'#9CA3AF'}, Rest:{bg:'#1C1917',dot:'#D8D3C8'}
};
var CYCLES = {
  fat:      ["Cardio","Chest","Swim","Recovery","Chest","Swim"],
  strength: ["Chest","Cardio","Chest","Recovery","Chest","Cardio"],
  mobility: ["Recovery","Swim","Recovery","Cardio","Swim","Recovery"]
};

function phaseForDay(d){
  for(var i=0;i<PHASES.length;i++){ if(d>=PHASES[i].range[0] && d<=PHASES[i].range[1]) return PHASES[i]; }
  return PHASES[3];
}
function baseSetsReps(phaseId){
  var table = [{sets:3,reps:12},{sets:4,reps:11},{sets:4,reps:10},{sets:5,reps:9}];
  return table[phaseId-1];
}
function isRestSlot(weekdayIdx, freq){
  var restCount = 7-freq;
  if(restCount<=0) return false;
  for(var k=0;k<restCount;k++){ if(Math.round(k*(7/restCount)) === weekdayIdx) return true; }
  return false;
}
var CARDIO_ACTIVITIES = {
  running:    { label:'Running',                 build:function(min){ return min+' min run — steady pace, easy conversation effort'; } },
  cycling:    { label:'Cycling',                  build:function(min){ return 'Stationary bike or outdoor ride, '+min+' min steady effort'; } },
  swimming:   { label:'Swimming',                 build:function(min){ return 'Pool laps, '+min+' min — freestyle or your preferred stroke'; } },
  rowing:     { label:'Rowing',                   build:function(min){ return 'Rowing machine, '+min+' min steady state'; } },
  group:      { label:'Group fitness class',      build:function(min){ return min+' min group fitness class — spin, dance, bootcamp, whatever\'s on the schedule'; } },
  yoga:       { label:'Yoga / mobility flow',      build:function(min){ return min+' min yoga or mobility flow — lower intensity, still counts'; } },
  elliptical: { label:'Elliptical / incline walk', build:function(min){ return 'Elliptical or incline treadmill walk, '+min+' min steady effort'; } }
};
var CARDIO_DEFAULT_POOL = ['elliptical','cycling','running'];

function buildDetail(type, phaseId, volMod, sex, dayNum, cardioTypes){
  var sr = baseSetsReps(phaseId);
  var sets = Math.max(2, Math.round(sr.sets*volMod));
  var reps = sr.reps;
  if(type==='Chest') return sets+'×'+reps+' machine chest press · '+sets+'×'+reps+' cable fly · '+Math.max(3,sets)+'×'+(reps+3)+' cable crunch';
  if(type==='Cardio'){
    var pool = (cardioTypes && cardioTypes.length) ? cardioTypes : CARDIO_DEFAULT_POOL;
    var key = pool[(dayNum||0) % pool.length];
    var activity = CARDIO_ACTIVITIES[key] || CARDIO_ACTIVITIES.elliptical;
    var min = Math.round((15+phaseId*7)*volMod);
    return activity.build(min);
  }
  if(type==='Swim') return 'Pool session, '+Math.round((20+phaseId*6)*volMod)+' min — mix steady laps and short intervals';
  if(type==='HIIT') return (6+phaseId)+' rounds: '+(30+phaseId*5)+'s max effort / '+Math.max(20,60-phaseId*5)+'s easy';
  if(type==='Recovery'){
    if(sex==='female') return 'Foam roll, stretch, and light core activation — 20 min. Plus hip/glute activation work (banded lateral walks, clamshells, single-leg bridges) — commonly recommended in the injury-prevention literature to build knee stability.';
    return 'Foam roll, stretch, and light core activation — 20 min';
  }
  return 'Full rest — no session scheduled';
}
function generateDayMap(plan){
  var map = {};
  var cycle = CYCLES[plan.goal] || CYCLES.fat;
  var activeCounter = 0;
  for(var d=1; d<=100; d++){
    var phase = phaseForDay(d);
    var weekdayIdx = (d-1)%7;
    var type;
    if(isRestSlot(weekdayIdx, plan.days_per_week)){
      type = 'Rest';
    } else {
      type = cycle[activeCounter % cycle.length];
      activeCounter++;
      if(phase.id>=3 && plan.goal!=='mobility' && activeCounter%5===0) type = 'HIIT';
    }
    var note = null;
    var overrides = plan.day_overrides || {};
    var override = overrides[d];
    if(override){ type = override.type || type; note = override.note; }
    map[d] = { type:type, label: type+' Day', detail: buildDetail(type, phase.id, plan.volume_modifier||1, plan.sex, d, plan.cardio_types), phase: phase.id, note:note };
  }
  return map;
}

/* ═══════════════════════════ ADAPTIVE ENGINE ═══════════════════════════ */
function attendanceClause(sessions, daysPerWeek){
  var completion = sessions/daysPerWeek;
  if(sessions === 0) return 'Zero sessions logged this week';
  if(completion >= 0.999) return 'Every session happened this week — '+sessions+'/'+daysPerWeek;
  if(completion >= 0.85) return sessions+'/'+daysPerWeek+' sessions — just about everything got done';
  if(completion >= 0.6) return sessions+'/'+daysPerWeek+' sessions, a solid majority of the week';
  if(completion >= 0.4) return sessions+'/'+daysPerWeek+' sessions — a bit under half the week';
  return sessions+'/'+daysPerWeek+' sessions — most of the week did not happen';
}
function effortClause(effort){
  if(effort<=1) return 'effort barely registered at 1/5';
  if(effort===2) return 'effort stayed low at 2/5';
  if(effort===3) return 'effort sat in the middle at 3/5';
  if(effort===4) return 'effort ran high at 4/5';
  return 'effort maxed out at 5/5';
}
function hrClause(hrDelta){
  if(hrDelta<=-3) return 'resting heart rate dropped a real '+Math.abs(hrDelta)+'bpm';
  if(hrDelta<=-1) return 'resting heart rate eased down '+Math.abs(hrDelta)+'bpm';
  if(hrDelta===0) return 'resting heart rate held flat';
  if(hrDelta<=2) return 'resting heart rate crept up '+hrDelta+'bpm';
  if(hrDelta<=4) return 'resting heart rate climbed a noticeable '+hrDelta+'bpm';
  return 'resting heart rate jumped '+hrDelta+'bpm';
}
function composeDetail(sessions, effort, hrDelta, daysPerWeek, closing){
  return attendanceClause(sessions, daysPerWeek)+', '+effortClause(effort)+', and '+hrClause(hrDelta)+'. '+closing;
}
function checkinVerdict(sessions, effort, hrDelta, daysPerWeek){
  daysPerWeek = daysPerWeek || 7;
  var completion = sessions/daysPerWeek;

  if(completion < 0.5 && hrDelta >= 4) return {
    tag:'OVERREACH', color:'var(--coral)', bg:'rgba(168,65,47,.14)',
    detail: composeDetail(sessions, effort, hrDelta, daysPerWeek, 'That specific combination reads as overreach, not a rough week — volume drops meaningfully and the toughest session on the calendar becomes a recovery day.'),
    volMult:0.75, swapHardestDay:true
  };
  if(completion < 0.6 && hrDelta > 1) return {
    tag:'PULL BACK', color:'var(--coral)', bg:'rgba(168,65,47,.12)',
    detail: composeDetail(sessions, effort, hrDelta, daysPerWeek, 'Recovery is falling behind the training, even if it does not look dramatic yet — volume steps down and the hardest day swaps to recovery before this compounds.'),
    volMult:0.85, swapHardestDay:true
  };
  if(completion < 0.6){
    return {
      tag:'REBUILD', color:'var(--sky)', bg:'rgba(92,158,232,.12)',
      detail: composeDetail(sessions, effort, hrDelta, daysPerWeek, 'Your body had nothing to do with the miss here — this reads as a calendar problem. Next week repeats the same targets instead of adding more on top of a plan that is not fitting the week yet.'),
      volMult:1.0, swapHardestDay:false
    };
  }
  if(completion >= 0.7 && effort >= 4 && hrDelta >= 1){
    return {
      tag:'GRINDING', color:'var(--sky)', bg:'rgba(92,158,232,.12)',
      detail: composeDetail(sessions, effort, hrDelta, daysPerWeek, 'Everything is getting done, but it is visibly costing something. Volume holds flat this week rather than adding to it.'),
      volMult:1.0, swapHardestDay:false
    };
  }
  if(completion >= 0.85 && hrDelta <= -1 && effort <= 2){
    return {
      tag:'BREAKTHROUGH', color:'var(--lime)', bg:'rgba(43,140,126,.16)',
      detail: composeDetail(sessions, effort, hrDelta, daysPerWeek, 'That combination is real fitness improvement, not luck. Next week adds real load while it is working.'),
      volMult:1.15, swapHardestDay:false
    };
  }
  if(completion >= 0.85 && hrDelta<=0 && effort<=3){
    return {
      tag:'PROGRESS', color:'var(--lime)', bg:'rgba(43,140,126,.12)',
      detail: composeDetail(sessions, effort, hrDelta, daysPerWeek, 'The plan is landing well at its current level. Next week adds a bit more.'),
      volMult:1.1, swapHardestDay:false
    };
  }
  return {
    tag:'HOLD STEADY', color:'var(--lime)', bg:'rgba(43,140,126,.12)',
    detail: composeDetail(sessions, effort, hrDelta, daysPerWeek, 'Nothing here calls for a change in either direction. Next week repeats this week\'s plan as written.'),
    volMult:1.0, swapHardestDay:false
  };
}

function applyAdaptation(plan, currentDay, verdict){
  var newMod = Math.max(0.6, Math.min(1.4, (plan.volume_modifier||1) * verdict.volMult));
  var overrides = assign({}, plan.day_overrides||{});
  if(verdict.swapHardestDay){
    var dayMap = generateDayMap(assign({}, plan, {volume_modifier:newMod}));
    for(var d=currentDay+1; d<=Math.min(100,currentDay+7); d++){
      if(dayMap[d].type==='HIIT' || dayMap[d].type==='Chest'){
        overrides[d] = { type:'Recovery', note:'Swapped after your check-in — pulling back this week.' };
        break;
      }
    }
  }
  return assign({}, plan, { volume_modifier:newMod, day_overrides:overrides });
}

/* ═══════════════════════════ GOO-GOO MEAL HINT (same-origin localStorage) ═══════════════════════════
   Writes which real calendar weekdays have a scheduled workout, so s1e1
   can nudge those dinners with a note. Day 1 of a plan isn't inherently
   "Monday" — it's anchored to whatever weekday the plan was actually
   created on, via created_at, so this has to be computed, not assumed. */
function writeMealHint(plan){
  if(!plan || !plan.created_at) return;
  var JS_DOW_LABELS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var startDow = new Date(plan.created_at).getDay(); // 0=Sun..6=Sat, the weekday Day 1 actually fell on
  var trainingDays = [];
  for(var i=0;i<7;i++){
    if(!isRestSlot(i, plan.days_per_week)){
      trainingDays.push(JS_DOW_LABELS[(startDow+i)%7]);
    }
  }
  try{
    localStorage.setItem('pf_meal_hint', JSON.stringify({
      trainingDays: trainingDays,
      daysPerWeek: plan.days_per_week,
      goal: plan.goal,
      source: 'PlanForge',
      updated: new Date().toISOString()
    }));
  }catch(e){ console.error('Could not write meal hint', e); }
}

async function loadUserData(){
  try{
    var plans = await db('/plans_cust?select=*&limit=1');
    if(!plans || plans.length===0){ state.screen='onboarding'; render(); return; }
    state.plan = plans[0];
    writeMealHint(state.plan);
    var progressRows = await db('/workout_progress_cust?select=*&limit=1');
    state.progress = (progressRows && progressRows[0]) || { completed_days: [] };
    var checkins = await db('/checkins_cust?select=*&order=week_number.asc');
    state.checkins = checkins || [];
    state.ciSessions = Math.min(state.plan.days_per_week, (state.progress.completed_days||[]).length % 7 || Math.ceil(state.plan.days_per_week/2));
    state.screen = 'app';
  } catch(e){
    console.error(e);
    signOut(); state.screen='auth'; state.authError='Session expired — sign in again.'; state.busy=false;
  }
  render();
}

async function handleCreatePlan(goal, freq, sex, cardioTypes, skipGate){

      redirectToPay({type:'newplan', payload:{goal:goal, freq:freq, sex:sex, cardioTypes:cardioTypes}});
      return;
    }
    consumeUnlock();
  }
  state.busy = true; render();
  try{
    // New plan starts from where the last one left off, not a blank baseline —
    // carry forward the prior plan's adapted volume, then nudge by how much of
    // it actually got completed.
    var completedCount = (state.progress.completed_days||[]).length;
    var startVolMod = 1.0;
    var dayOverrides = {};
    if(isRegenerate){
      startVolMod = (state.plan && state.plan.volume_modifier) || 1.0;
      var completionRatio = completedCount/100;
      if(completionRatio >= 0.7) startVolMod += 0.05;
      else if(completionRatio < 0.3) startVolMod -= 0.05;
      startVolMod = Math.max(0.8, Math.min(1.3, startVolMod));
      dayOverrides[1] = { note: 'New plan started at ' + Math.round(startVolMod*100) + '% volume — carried forward from ' + completedCount + ' days logged on your last plan.' };
    }
    var body = { user_id: state.session.user.id, goal:goal, days_per_week:freq, sex: sex||null, cardio_types: cardioTypes||[], volume_modifier: startVolMod, day_overrides: dayOverrides };
    var rows;
    if(isRegenerate){
      rows = await db('/plans_cust?user_id=eq.'+state.session.user.id, { method:'PATCH', body:JSON.stringify(body) });
      await db('/workout_progress_cust?user_id=eq.'+state.session.user.id, { method:'PATCH', body:JSON.stringify({ completed_days:[], updated_at: new Date().toISOString() }) });
    } else {
      rows = await db('/plans_cust', { method:'POST', body:JSON.stringify(body) });
      await db('/workout_progress_cust', { method:'POST', body:JSON.stringify({ user_id: state.session.user.id, completed_days:[] }) });
    }
    state.plan = rows[0];
    writeMealHint(state.plan);
    state.progress = { completed_days: [] };
    state.busy=false; state.screen='app'; render();
  } catch(e){
    console.error(e);
    state.busy=false;
    alert('Could not generate your plan: ' + e.message);
    render();
  }
}
async function toggleDay(dayNum){
  var set = {};
  var i;
  var current = state.progress.completed_days||[];
  for(i=0;i<current.length;i++){ set[current[i]] = true; }
  if(set[dayNum]) delete set[dayNum]; else set[dayNum] = true;
  var next = [];
  for(var key in set){ next.push(Number(key)); }
  state.progress.completed_days = next;
  render();
  try{
    await db('/workout_progress_cust?user_id=eq.'+state.session.user.id, {
      method:'PATCH',
      body: JSON.stringify({ completed_days: state.progress.completed_days, updated_at: new Date().toISOString() })
    });
  } catch(e){ console.error(e); }
}
async function submitCheckin(){
  var s = state.ciSessions, e = state.ciEffort, h = state.ciHr, w = state.ciWaist, wt = state.ciWeight, notes = state.ciNotes;
  var v = checkinVerdict(s, e, h, state.plan.days_per_week);
  var currentDay = (state.progress.completed_days||[]).length || 1;
  var weekNumber = state.checkins.length + 1;
  state.busy = true; render();
  try{
    var updatedPlan = applyAdaptation(state.plan, currentDay, v);
    await db('/plans_cust?user_id=eq.'+state.session.user.id, {
      method:'PATCH',
      body: JSON.stringify({ volume_modifier: updatedPlan.volume_modifier, day_overrides: updatedPlan.day_overrides })
    });
    state.plan = updatedPlan;
    var row = await db('/checkins_cust', {
      method:'POST',
      body: JSON.stringify({ user_id: state.session.user.id, week_number: weekNumber, sessions_completed:s, days_per_week: state.plan.days_per_week, effort:e, hr_delta:h, waist: w||null, weight: wt||null, notes: notes||null, verdict:v.tag })
    });
    state.checkins = state.checkins.concat([row[0]]);
    state.ciNotes = '';
    state.busy = false;
    render();
  } catch(err){
    console.error(err);
    state.busy = false;
    alert('Could not save your check-in: ' + err.message);
    render();
  }
}

function buildProgressChart(){
  if(state.checkins.length < 2) return;
  var hrEstimate = 68;
  var hrSeries = [];
  var i;
  for(i=0;i<state.checkins.length;i++){ hrEstimate += state.checkins[i].hr_delta; hrSeries.push(hrEstimate); }
  var completionSeries = [];
  for(i=0;i<state.checkins.length;i++){
    var dpw = state.checkins[i].days_per_week || 7; // older rows saved before this fix fall back to 7
    completionSeries.push(Math.round(state.checkins[i].sessions_completed/dpw*100));
  }
  var waistSeries = [];
  for(i=0;i<state.checkins.length;i++){ if(state.checkins[i].waist!=null) waistSeries.push(state.checkins[i].waist); }
  var weightSeries = [];
  for(i=0;i<state.checkins.length;i++){ if(state.checkins[i].weight!=null) weightSeries.push(state.checkins[i].weight); }

  var metrics = {
    completion: { label:'Weekly completion (% of goal)', color:'#2B8C7E', data: completionSeries },
    hr:         { label:'Resting HR estimate (bpm)', color:'#3B7DD8', data: hrSeries }
  };
  if(waistSeries.length === state.checkins.length){
    metrics.waist = { label:'Waist (in)', color:'#A8412F', data: waistSeries };
  }
  if(weightSeries.length === state.checkins.length){
    metrics.weight = { label:'Weight', color:'#C97A0A', data: weightSeries };
  }

  var svg = el('chartSvg'); var toggles = el('chartToggles');
  if(!svg || !toggles) return;
  toggles.innerHTML = '';
  var on = { waist:true, weight:true, hr:true, completion:true };

  function draw(){
    svg.innerHTML = '';
    var w=640,h=180,pad=18,n=state.checkins.length;
    for(var gi=0; gi<=3; gi++){
      var y = pad + (h-2*pad)*gi/3;
      var l = document.createElementNS("http://www.w3.org/2000/svg","line");
      l.setAttribute("x1",pad); l.setAttribute("x2",w-pad); l.setAttribute("y1",y); l.setAttribute("y2",y);
      l.setAttribute("stroke","#E5E1D8"); svg.appendChild(l);
    }
    for(var key in metrics){
      var m = metrics[key];
      if(!on[key]) continue;
      var min = Math.min.apply(null, m.data), max = Math.max.apply(null, m.data);
      var pts = [];
      for(var pi=0; pi<m.data.length; pi++){
        var v = m.data[pi];
        var x = pad + (w-2*pad)*(n<=1?0:pi/(n-1));
        var norm = max===min?0.5:(v-min)/(max-min);
        pts.push([x, h-pad-norm*(h-2*pad)]);
      }
      var pointsStr = '';
      for(pi=0; pi<pts.length; pi++){ pointsStr += pts[pi][0]+','+pts[pi][1]+' '; }
      var poly = document.createElementNS("http://www.w3.org/2000/svg","polyline");
      poly.setAttribute("points", pointsStr);
      poly.setAttribute("fill","none"); poly.setAttribute("stroke",m.color);
      poly.setAttribute("stroke-width","2.5"); poly.setAttribute("stroke-linecap","round"); poly.setAttribute("stroke-linejoin","round");
      svg.appendChild(poly);
      for(pi=0; pi<pts.length; pi++){
        var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
        c.setAttribute("cx",pts[pi][0]); c.setAttribute("cy",pts[pi][1]); c.setAttribute("r",3); c.setAttribute("fill",m.color);
        var t = document.createElementNS("http://www.w3.org/2000/svg","title");
        t.textContent = 'Week '+state.checkins[pi].week_number+' · '+m.label+': '+m.data[pi];
        c.appendChild(t); svg.appendChild(c);
      }
    }
  }
  for(var key2 in metrics){
    (function(k, m){
      var chip = document.createElement('div');
      chip.className = 'chart-toggle';
      chip.innerHTML = '<span class="sw" style="background:'+m.color+'"></span>'+m.label;
      chip.addEventListener('click', function(){ on[k]=!on[k]; chip.classList.toggle('off', !on[k]); draw(); });
      toggles.appendChild(chip);
    })(key2, metrics[key2]);
  }
  draw();
}

/* ═══════════════════════════ EVENTS ═══════════════════════════ */
function wireEvents(){
  if(state.screen==='config'){
    el('tryDemo').onclick = startDemo;
  }
  if(state.screen==='auth'){
    var emailEl = el('authEmail'), passEl = el('authPassword');
    el('authSubmit').onclick = function(){ handleAuthSubmit(emailEl.value.trim(), passEl.value); };
    el('authToggle').onclick = function(){ state.authMode = state.authMode==='signup'?'signin':'signup'; state.authError=''; render(); };
    var switchLink = el('authSwitchToSignup');
    if(switchLink) switchLink.onclick = function(){ state.authMode='signup'; state.authError=''; render(); };
  }
  if(state.screen==='onboarding'){
    var goal='fat', freq=null;
    var goalChips = document.querySelectorAll('#goalChips .chip');
    var gi;
    for(gi=0; gi<goalChips.length; gi++){
      (function(chip){
        chip.onclick = function(){
          var all = document.querySelectorAll('#goalChips .chip');
          for(var x=0;x<all.length;x++){ all[x].classList.remove('active'); }
          chip.classList.add('active'); goal = chip.dataset.goal;
        };
      })(goalChips[gi]);
    }
    var freqChips = document.querySelectorAll('#freqChips .chip');
    for(gi=0; gi<freqChips.length; gi++){
      (function(chip){
        chip.onclick = function(){
          var all = document.querySelectorAll('#freqChips .chip');
          for(var x=0;x<all.length;x++){ all[x].classList.remove('active'); }
          chip.classList.add('active'); freq = Number(chip.dataset.freq);
        };
      })(freqChips[gi]);
    }
    var cardioTypes = [];
    var cardioChips = document.querySelectorAll('#cardioChips .chip');
    for(gi=0; gi<cardioChips.length; gi++){
      (function(chip){
        chip.onclick = function(){
          chip.classList.toggle('active');
          var val = chip.dataset.cardio;
          var idx = cardioTypes.indexOf(val);
          if(chip.classList.contains('active')){ if(idx===-1) cardioTypes.push(val); }
          else { if(idx!==-1) cardioTypes.splice(idx,1); }
        };
      })(cardioChips[gi]);
    }
    var sex = '';
    var sexChips = document.querySelectorAll('#sexChips .chip');
    for(gi=0; gi<sexChips.length; gi++){
      (function(chip){
        chip.onclick = function(){
          var all = document.querySelectorAll('#sexChips .chip');
          for(var x=0;x<all.length;x++){ all[x].classList.remove('active'); }
          chip.classList.add('active'); sex = chip.dataset.sex;
        };
      })(sexChips[gi]);
    }
    el('onbSubmit').onclick = function(){
      if(!freq){ alert('Pick how many days per week you\'re training first — there\'s no default, since the whole plan is built around that number.'); return; }
      handleCreatePlan(goal, freq, sex, cardioTypes);
    };
    var cancelBtn = el('onbCancel');
    if(cancelBtn) cancelBtn.onclick = function(){ state.screen='app'; render(); };
  }
  if(state.screen==='app'){
    el('signOutBtn').onclick = DEMO ? resetDemo : signOut;
    el('newPlanBtn').onclick = function(){ state.screen='onboarding'; render(); };

    var toggleBtns = document.querySelectorAll('[data-toggle]');
    var i;
    for(i=0;i<toggleBtns.length;i++){
      (function(btn){ btn.onclick = function(){ toggleDay(Number(btn.dataset.toggle)); }; })(toggleBtns[i]);
    }
    var expandBtns = document.querySelectorAll('[data-expand]');
    for(i=0;i<expandBtns.length;i++){
      (function(btn){
        btn.onclick = function(){
          var d = Number(btn.dataset.expand);
          state.expandedDay = state.expandedDay===d ? null : d;
          render();
        };
      })(expandBtns[i]);
    }
    // note: phase tabs are handled entirely by the radio-input + CSS :checked
    // rules above — no click handlers needed for switching.

    var sEl=el('inSessions'), eEl=el('inEffort'), hEl=el('inHr'), wEl=el('inWaist'), wtEl=el('inWeight'), nEl=el('inNotes');
    function updateVerdict(){
      state.ciSessions=Number(sEl.value); state.ciEffort=Number(eEl.value); state.ciHr=Number(hEl.value); state.ciWaist=wEl.value;
      el('valSessions').textContent=state.ciSessions; el('valEffort').textContent=state.ciEffort;
      el('valHr').textContent=(state.ciHr>0?'+':'')+state.ciHr;
      var v = checkinVerdict(state.ciSessions, state.ciEffort, state.ciHr, state.plan.days_per_week);
      el('verdictBox').innerHTML = '<span class="verdict-tag" style="color:'+v.color+';background:'+v.bg+';">'+v.tag+'</span><span>'+v.detail+'</span>';
    }
    sEl.oninput = updateVerdict; eEl.oninput = updateVerdict; hEl.oninput = updateVerdict;
    wEl.oninput = function(){ state.ciWaist = wEl.value; };
    wtEl.oninput = function(){ state.ciWeight = wtEl.value; };
    nEl.oninput = function(){ state.ciNotes = nEl.value; };
    updateVerdict();
    el('ciSubmit').onclick = function(){ submitCheckin(); };

    var shareKindEls = document.querySelectorAll('#shareKinds .share-kind');
    for(i=0;i<shareKindEls.length;i++){
      (function(el2){ el2.onclick = function(){ state.shareKind = el2.dataset.kind; render(); }; })(shareKindEls[i]);
    }
    var shareBtns = document.querySelectorAll('.share-btn');
    for(i=0;i<shareBtns.length;i++){
      (function(btn){
        btn.onclick = function(){
          var dm = generateDayMap(state.plan);
          var cArr = state.progress.completed_days||[];
          var cSet = {};
          for(var k=0;k<cArr.length;k++){ cSet[cArr[k]] = true; }
          var cCount = cArr.length;
          var sPct = Math.round(cCount/100*100);
          var lastDone = 0;
          for(var k2=0;k2<cArr.length;k2++){ if(cArr[k2] > lastDone) lastDone = cArr[k2]; }
          var sPhase = phaseForDay(Math.max(1, lastDone+1));
          var sNextDay = 1;
          for(var dn=1; dn<=100; dn++){ if(!cSet[dn]){ sNextDay = dn; break; } }
          doShare(state.shareKind, state.plan, cCount, sPct, sPhase.name, dm[sNextDay], btn.dataset.platform);
        };
      })(shareBtns[i]);
    }

    buildProgressChart();
  }
}

boot();
</script>
